name: Publish
on:
    push:
        branches: [main]
jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v3
              with:
                  node-version: "20.x"
                  registry-url: "https://registry.npmjs.org"
            - run: npm install
            - run: npm run build
            - run: npm publish
              working-directory: ./build
              env:
                  NPM_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
